<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MLO_ChatGPT: Chat, Work, Create &amp; Code with AI</title>
  <link rel="stylesheet" href="/style/css/style.css">
</head>
<body>

  <div class="app-body">

    <!-- Left navigation panel -->
          <aside class="sidebar">
      <nav class="sidebar-nav">
        <button class="nav-btn">New chat</button>
        <button class="nav-btn">Search chats</button>
        <button class="nav-btn">Images</button>
        <button class="nav-btn">Plugins</button>
        <button class="nav-btn">Deep research</button>
      </nav>

      <!-- Bottom section -->
      <div class="sidebar-bottom">
        <button class="nav-btn small">See plans and pricing</button>
        <button class="nav-btn small">Settings</button>
        <button class="nav-btn small">Help</button>

        <div class="promo-card">
          <p class="promo-title">Get responses tailored to you</p>
          <p class="promo-text">
            Log in to get answers based on saved chats, plus create images and upload files.
          </p>
          <button class="login-btn">Log in</button>
        </div>
      </div>
    </aside>
    </aside>

   <main class="main">
      <header class="main-header">
        <div class="app-title">
          ChatGPT <button class="chevron"> ⌄ </button>
        </div>
        <div class="header-actions">
          <button class="login-link">Log in</button>
          <button class="signup-btn">Sign up for free</button>
        </div>
      </header>
            
      <section class="hero">
        <h1>Where should we begin?</h1>

        <div class="prompt-bar">
          <span class="plus-icon">+</span>
          <span class="prompt-placeholder">Ask ChatGPT</span>
          <span class="mic-icon">🎤</span>
          <span class="send-btn">↑</span>
        </div>

        <button class="suggestion-pill">What can you do?</button>
      </section>
    </main>

  </div>

</body>
</html>
